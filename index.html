ls(A,t){let a=t.x-A.x,e=t.y-A.y,I=Math.hypot(a,e);if(I<1e-8)return null;let i={x:(A.x+t.x)/2,y:(A.y+t.y)/2};return{radius:I,m:i,c:{x:i.x+e*Math.sqrt(3)/2,y:i.y-a*Math.sqrt(3)/2},e:{x:i.x-e*Math.sqrt(3)/2,y:i.y+a*Math.sqrt(3)/2}}}var Wo=[{id:"I.1",title:"作一个等边三角形",question:"不用量尺，怎样得到三条一样长的边？",intro:"我们习惯用测量判断长度是否相等。但一把再精细的尺子，也只能给出有限精度的结果。试着只用圆规与无刻度直尺，从圆的性质出发，让相等成为构造本身的结果。",steps:["给定线段","画第一个圆","画第二个圆","连接并完成"],instructions:["给定不同的两点 A、B，连接它们。","以 A 为圆心，AB 为半径作圆。","以 B 为圆心，BA 为半径作圆，取上方交点 C。","连接 AC、BC。现在试着解释三边为什么相等。"],proof:[["AC = AB","C 在以 A 为圆心的圆上，两条线段都是这个圆的半径。","圆的定义"],["BC = BA","C 也在以 B 为圆心的圆上，两条线段都是这个圆的半径。","圆的定义"],["AC = BC = AB","等于同一量的量彼此相等，所以三条边相等。","公理 1"]],teach:"不靠测量，你怎样解释三边相等？",checks:["说明 C 同时位于两个圆上","分别解释 AC = AB 和 BC = BA","由相等关系得到三边相等"],deeper:"两个圆为什么一定相交？欧几里得在这里使用了交点，却没有在原有公设中充分交代其存在性。现代几何会补充相应的连续性条件。看见一个隐含假设，是理解证明的下一步。",source:"https://mathcs.clarku.edu/~djoyce/elements/bookI/propI1.html"},{id:"I.10",title:"把一条线段分成两半",question:"没有刻度，怎样找到恰好一半的位置？",intro:"“看起来在中间”和“到两端的距离相等”并不是同一种理由。先利用等边三角形，再追溯角平分与全等的依据，就能从已知的相等关系中找到中点。",steps:["给定线段","构造等边三角形","作角平分线","得到中点"],instructions:["给定线段 AB，寻找它的中点 D。","沿用命题 I.1 的两圆构造，得到等边三角形 ABC。","连接两圆交点 C、E。根据 I.9，CE 平分角 ACB。","令 CE 与 AB 交于 D。由 I.4 的全等判定，AD = DB。"],proof:[["CA = CB","ABC 是等边三角形，因此两边相等。","命题 I.1"],["∠ACD = ∠BCD","CE 是按 I.9 构造的角平分线；D 在 CE 上。","命题 I.9"],["AD = DB","CA = CB，CD 为公共边，夹角相等；由边角边全等得到两底边相等。","命题 I.4"]],teach:"为什么找到的是中点，而不只是看起来在中间的点？",checks:["交代等边三角形提供 CA = CB","说明角平分线使两个夹角相等","利用公共边 CD 和 I.4 推出 AD = DB"],deeper:"这一课依赖 I.1、I.9 与 I.4。“第一性原理”不意味着每次重新证明一切，而是让每一个借用的结论都能追溯到依据。",source:"https://mathcs.clarku.edu/~djoyce/elements/bookI/propI10.html"},{id:"I.47",title:"从边长走向面积",question:"直角三角形的三条边，藏着怎样的面积关系？",intro:"把每一条边想象成一个正方形的边。长度的问题，就变成了面积的问题。这里采用现代面积拼合解释，帮助建立直觉；欧几里得的原证明使用全等与平行线间的面积关系。",steps:["一个直角三角形","四个相同三角形","计算中央面积","得到关系"],instructions:["设直角边为 a、b，斜边为 c。用下方滑杆改变直角边。","把四个相同的直角三角形放进边长 a + b 的正方形中。","中央四边形各边为 c，相邻锐角互余，所以它是正方形。","中央面积 c² = (a + b)² − 4 × ab / 2 = a² + b²。"],proof:[["中央是正方形","四条边都等于 c。直角三角形的两个锐角互余，因此中央的四个角都是直角。","现代面积拼合解释"],["c² = (a + b)² − 2ab","大正方形去掉四个面积为 ab/2 的三角形，剩下中央正方形。","面积可加性"],["c² = a² + b²","展开 (a + b)²，再消去 2ab，即得直角边平方和等于斜边平方。","代数化简"]],teach:"为什么这个拼图对不同的直角三角形都成立？",checks:["说明四个三角形相同且没有重叠或空隙","解释中央四边形为何为正方形","用整体减去四个三角形得到面积关系"],deeper:"图形可以帮助发现关系，但一个精确的数字例子并不能证明所有情况。这里保留任意正数 a、b，并说明拼合中的角与面积关系，才能从观察走向一般论证。",source:"https://mathcs.clarku.edu/~djoyce/elements/bookI/propI47.html"}],No=[{id:"point",name:"点",kind:"理想对象",plain:"只表示位置，不占据大小。",formal:"原典：点是没有部分的。",experiment:"把屏幕上的点放大，你看到的是更大的显示符号；数学中的点仍不具有面积。",mis:"屏幕像素是表示点的工具，不是点本身。",symbol:"A"},{id:"line",name:"线段与直线",kind:"基本概念",plain:"线段有两个端点；直线可以向两端延伸。",formal:"原典将线描述为没有宽度的长度，并另行描述直线。",experiment:"改变端点的位置，观察长度与方向变化。注意画面边缘只是屏幕的边界。",mis:"图上画出的有限长度，不是整条无限直线。",symbol:"AB"},{id:"circle",name:"圆与半径",kind:"定义",plain:"离一个固定点同样远的点，围成一个圆。",formal:"现代解释：平面上到定点的距离等于一个正数的点的集合。",experiment:"用“沿圆移动 P”滑杆移动圆上的点，观察它到圆心 O 的距离始终不变；再用半径滑杆改变这个距离。",mis:"圆周是一条曲线；圆盘还包括内部。原典与现代术语范围需要区分。",symbol:"r"},{id:"angle",name:"角",kind:"基本概念",plain:"两条射线张开的程度。",formal:"此处讨论同一平面内有公共端点的两条射线所形成的角。",experiment:"改变射线方向，观察角度；改变画出的射线长度，角度并不会随之变化。",mis:"边画得越长，角不一定越大。",symbol:"α"},{id:"axiom",name:"定义、公设与公理",kind:"推理起点",plain:"先说明谈什么，再说明允许做什么、接受什么关系。",formal:"卷一列出定义、五条公设与五条公理（共同概念）。不同译本术语可能不同。",experiment:"“圆是什么”是定义；“可以作圆”是公设；“等于同一量的量彼此相等”是共同概念。",mis:"公设在当前体系中被采用，并不等于已经由本体系其他前提证明。",symbol:"⇒"},{id:"proof",name:"观察与证明",kind:"数学方法",plain:"观察帮助猜想；证明交代结论为何由前提推出。",formal:"证明需要明确条件，并通过有效的推理连接前提与结论。",experiment:"把图形拖动十次，每次都相等；接着隐藏数值，试着只用圆的定义解释相等。",mis:"数值接近是测量结果；精确相等需要相应的数学依据。",symbol:"∴"}],ss=[{name:"欧多克索斯",date:"公元前 4 世纪",place:"比例与穷竭",title:"没有共同单位，怎样继续比较？",text:"他的比例理论与穷竭方法，为处理不可公度量以及曲边图形提供了重要路径。卷五的倍数比较让“比相等”不必先化成两个整数之比。",question:"如果测量永远不能恰好量尽，数学能否仍给出精确关系？",source:"https://mathshistory.st-andrews.ac.uk/Biographies/Eudoxus/"},{name:"泰阿泰德",date:"公元前 5—4 世纪",place:"不可公度量与规则立体",title:"怎样把陌生的对象分成可理解的类型？",text:"古代记述把不可公度线与规则立体的研究同泰阿泰德联系起来。这些工作与《原本》第十卷、第十三卷的主题密切相关；具体归属来自后世材料，不能把全书某卷简单视作一人的原稿。",question:"一种分类除了名字，还应告诉我们哪些运算和构造关系？",source:"https://mathshistory.st-andrews.ac.uk/DSB/Theaetetus.pdf"},{name:"柏拉图",date:"公元前 4 世纪",place:"几何与自然哲学",title:"几何的秩序，是否就是自然的秩序？",text:"《蒂迈欧篇》用规则立体讨论物质世界的构成，这是古代自然哲学的一种解释。五种正凸多面体的数学分类，和用它们解释自然的主张，是需要分别评价的两件事。",question:"即使一种模型在数学上很优美，怎样检验它是否适合真实世界？",source:"https://plato.stanford.edu/entries/plato-timaeus/"},{name:"欧几里得",date:"约公元前 300 年",place:"亚历山大里亚",title:"怎样让零散的知识彼此支撑？",text:"《几何原本》的力量也在于组织：定义、公设、共同概念与命题形成可以追溯的推理结构。欧几里得的可靠生平材料很少，关于他的许多故事属于后世传说。",question:"假如删去一个先前命题，后面的证明还能成立吗？",source:"https://mathshistory.st-andrews.ac.uk/Biographies/Euclid/"},{name:"徐光启与利玛窦",date:"1607 年",place:"北京",title:"怎样把一种思考方式带进另一种语言？",text:"二人合作翻译《几何原本》前六卷，将几何概念与演绎论证带入新的语言环境。翻译既要传递词语，也要让读者理解词语之间的逻辑关系。",question:"如果“点”“线”“平行”没有现成的对应词，你会怎样解释？",source:"https://mathshistory.st-andrews.ac.uk/Biographies/Xu_Guangqi/"},{name:"罗巴切夫斯基与鲍耶",date:"19 世纪",place:"非欧几何的探索",title:"改变一条假设，会出现怎样的世界？",text:"关于平行公设的长期研究通向了非欧几何。几何不再只有一个被直觉预先决定的样子；研究者开始认真考察不同假设下可以建立的空间理论。",question:"一套理论内部自洽，是否就意味着它描述了真实空间？",source:"https://plato.stanford.edu/entries/geometry-19th/"},{name:"希尔伯特",date:"1899 年",place:"几何基础",title:"“显然如此”的地方，是否藏着遗漏？",text:"希尔伯特的《几何基础》推动了欧氏几何的现代公理化。关联、顺序、全等与连续性等关系被更明确地表达，图形直觉背后的假设也成为研究对象。",question:"点和线的名字可以改变，哪些关系必须保留？",source:"https://plato.stanford.edu/entries/geometry-19th/"}];var zt=U(X(),1);var AE=["I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII","XIII"],ta=[["平面几何的起点",48,"从点、线与圆，走到全等、平行和勾股定理。","没有刻度，我们还能知道什么？","欧几里得把构造问题与证明问题编排为可追溯的系统。图画提供对象，理由决定结论。","定义对象 → 允许构造 → 证明相等 → 比较面积"],["把代数看成面积",14,"用矩形与正方形理解乘法、平方及二次关系。","公式为什么会长成这个样子？","“几何代数”是现代解读。原典讨论的是线段与面积，并没有使用今天的字母方程。","分割 → 重组 → 补全正方形 → 等积转化"],["圆的内在秩序",37,"研究弦、圆心、切线、圆周角与相交线段。","圆上不断移动的点，为什么保持同一个角？","圆的对称性把位置变化变成不变量。三角形的全等与角关系成为研究曲线的工具。","半径 → 弦 → 切线 → 圆周角与幂"],["把图形安放进圆",16,"构造内接与外切的三角形、正方形、五边形和十五边形。","哪些对称图案可以只用尺规作出来？","作图是存在性证明的一种方式：给出允许的步骤，并证明产物满足条件。漂亮的近似图案还不是精确构造。","内外接 → 中心 → 正多边形 → 角的组合"],["不先相除，也能谈比例",25,"以等倍比较建立适用于可公度和不可公度量的比例理论。","两个不能共同量尽的长度，还能有相等的比吗？","欧多克索斯的比例思想绕开“所有长度都是整数之比”的限制，为面积和体积论证提供统一语言。","量与倍数 → 比的定义 → 变换 → 合比"],["相同形状，不同尺度",33,"把比例用于相似、面积、分割和几何构造。","把图形放大两倍，什么变成两倍，什么不会？","相似允许在不同尺度间推理，是地图、测量与科学模型的共同语言；应用前必须检查对应关系。","平行截线 → 相似 → 比例构造 → 面积尺度"],["从单位开始的数论",39,"从整除、互素与最大公约数出发研究整数。","不试遍所有因数，怎样找到最大的共同单位？","这里的“数”是单位的多。单位与数在原典中分开讨论；现代记号中的 1、0 与负数需要另作说明。","单位 → 整除 → 辗转相除 → 互素与最小公倍数"],["连比例与幂",27,"研究等比数列、平方数、立方数与中比例数。","两个数之间能插入几个整数，使比一直相同？","连续比例把算术与几何联系起来。现代指数写法压缩了古代用长度或数列表达的结构。","最简比例 → 连比例 → 平方 → 立方"],["数的结构与无限",36,"研究乘积、等比和、奇偶、素数无穷与完全数。","有限的一张素数表，为什么永远装不下所有素数？","有限推理可以给出关于无限的结论。无限素数的论证不需要真的列出无穷多个数。","乘积结构 → 新素因子 → 数列求和 → 完全数"],["不可公度的世界",115,"辨认长度与平方的可公度性，理解二项线、余分线及其分类。","一条能精确画出的线，为什么不一定能写成分数？","第十卷的“有理线”相对于指定单位线按平方可公度定义，比现代“有理数长度”更宽。理解这一差别，比背诵分类名更重要。","共同尺度 → 平方尺度 → 和式分类 → 差式与共轭"],["从平面走向空间",39,"研究直线和平面的关联、垂直、平行以及平行六面体。","一条线垂直另一条线，足够说明它竖直于地面吗？","三维直觉容易被二维投影误导。空间几何要求把“看起来相交”和真正的关联条件分开。","关联 → 垂直 → 立体角 → 等体积"],["用有限，逼近曲线",18,"通过穷竭思想研究圆、棱锥、圆锥、圆柱与球的量比。","只用直线图形，如何严密研究圆的面积？","穷竭法的核心是反证：假设差额为正，再用足够精细的逼近让余量小于这份差额。它与现代极限相关，但表达方式不同。","多边形逼近 → 面积比 → 锥柱关系 → 球体积比"],["五种正多面体",18,"把黄金分割、正多边形与空间构造汇合到五种正多面体。","为什么正多面体恰好只有五种？","柏拉图在《蒂迈欧篇》中赋予规则立体宇宙论意义；数学分类的证明与这种自然哲学解释需要分别理解。","黄金分割 → 正五边形 → 球内构造 → 五种可能"]].map((A,t)=>({id:t+1,roman:AE[t],title:A[0],count:A[1],intro:A[2],question:A[3],context:A[4],path:A[5],source:`https://mathcs.clarku.edu/~djoyce/elements/book${AE[t]}/book${AE[t]}.html`}));var wp=[[1,1,8,"相等，怎样从构造中产生？","congruence","不用尺子的刻度，你能把一段长度搬到另一个位置吗？","全等：对应边和对应角分别相等的图形。边角边判定必须使用两条已知边的夹角。",["以 AB 为半径分别作圆，交点 C 同时属于两个圆，因此 AC = AB，BC = AB。","由“等于同一量的量彼此相等”，三边相等。这是构造带来相等，而不是读数接近。","比较两个三角形时，把对应顶点配对；两边及其夹角相等可用 I.4，三边相等可用 I.8。"],"改变图中夹角。观察只保持两条边时，第三边会改变；再固定夹角，比较全等条件。","两边和任意一个角相等不一定全等；角必须是夹角，或另有充分条件。",["两条边已经固定，还需固定什么才能直接用边角边？",["任意一个角","两边的夹角","三角形的面积"],1,"边角边说的是两条已知边所夹的角。遗漏“夹”字会改变条件。"],"数学把“像不像”转成明确的对应关系。原典的叠合论证也提醒我们：移动图形时究竟允许保持什么？"],[1,9,26,"平分、垂直与三角形的边界","triangle","为什么三根任意长的木棒不一定围得成三角形？","三角不等式：任意两边之和大于第三边。等号对应退化为一直线。",["从给定点作等距的辅助点，用等腰三角形与全等关系构造角平分线和垂线（I.9—12）。","比较三角形的边与其对角：较大边对应较大角，反之也成立（I.18、19）。","延长一边并作辅助等腰三角形，可把两边之和化成一条线段，再用边角大小关系得到 I.20。"],"固定 a = 3、b = 4，改变 c。找出三角形存在的开区间，再解释 c = 7 为什么不能形成三角形。","“两边之和不小于第三边”不够；非退化三角形需要严格大于。",["3、4、7 能围成非退化三角形吗？",["能，是钝角三角形","能，是直角三角形","不能，落在退化边界"],2,"3 + 4 = 7，三点只能排在同一直线上。有效区间是 1 < c < 7。"],"存在性也是数学问题。一个构造题首先需要问：给出的条件允许这样的对象存在吗？"],[1,27,34,"平行公设藏在哪里？","parallel","为什么三角形内角和是 180°，而不是一次测量的巧合？","欧氏平行线：同一平面内，向两端无限延长仍不相交的直线。",["过三角形一个顶点作与对边平行的直线（I.31）。","由平行线的内错角相等（I.29），把另两个内角移到这个顶点旁。","三个角拼成平角，由 I.13 得和为两个直角，即现代记法的 180°。"],"改变三角形顶点的位置，观察三个角重新分配而总和保持不变。隐藏数值后复述平行线的作用。","I.29 使用第五公设；这条证明的结论属于欧氏平面，不能直接搬到球面上的测地三角形。",["这份内角和证明中，平行公设通过哪一步进入？",["把三个数相加","用 I.29 转移角","给顶点起名字"],1,"关键是平行线角关系。定义顶点和数值读数并没有提供这一步的逻辑依据。"],"看似显然的结论可能依赖一个深层假设。非欧几何并未推翻正确的条件推理，而是改变了前提。"],[1,35,48,"面积不变，通向勾股定理","area","顶点沿着一条平行线滑动，三角形面积会改变吗？","等积不等于全等。同底等高三角形的面积相等，即使外形不同。",["同底且在同一组平行线间的平行四边形等积（I.35）；对角线把它们平分为三角形。","因此同底等高三角形等积（I.37），平行四边形的面积是相应三角形的两倍（I.41）。","I.47 把直角边上的两个正方形分别转化为斜边正方形的两块矩形；两块拼合得到平方和关系。"],"移动顶点的水平位置，保持底与高不变。先预测面积，再核对；到精讲实验中继续探索 I.47。","只有直角三角形才能直接用 a² + b² = c²；一般三角形还需要角或投影的修正项。",["同底等高的两个三角形，一定是什么关系？",["全等","等积","三条边分别相等"],1,"面积由底和高决定；水平移动顶点通常会改变边长，所以不保证全等。"],"选择合适的不变量能把困难问题换一种形态：从边长转到面积，是一次表示方式的改变。"],[2,1,4,"让乘法分配律成为一幅图","partition","为什么 (a + b)² 不是 a² + b²？","矩形面积的可加性：沿边分割后，各部分面积之和等于整体面积。",["在边长 a + b 的正方形的两组邻边上，分别标出长度 a 与 b。","画出平行分割线，得到面积 a²、ab、ba、b² 四块。","不重叠也无遗漏地相加：(a + b)² = a² + 2ab + b²。这是 II.4 的现代符号解释。"],"改变 a 与 b 的比例，逐块指出两个 ab。让其中一段很短，解释交叉项为何仍不能随意删除。","这里 a、b 是正长度；代数把恒等式推广到负数时，需要额外的符号解释。",["把边长 3 + 2 的正方形分割，交叉的两块面积之和是多少？",["6","10","12"],2,"两块都是 3 × 2，各有 6，合计 12。"],"符号可以压缩思考，图像可以展开符号。先看见每一项的来源，再使用公式。"],[2,5,8,"把差补成一个正方形","difference","长方形的一边增加、另一边减少同样的量，面积会保持吗？","平方差：对正数 m 与 0 < x < m，有 (m + x)(m − x) = m² − x²。",["从边长 m 的正方形取走边长 x 的小正方形。","把剩余的 L 形分割并移动，可拼为长 m + x、宽 m − x 的矩形。","移动保面积，故矩形少了 x²；把小正方形补回便得到 II.5 所描述的等积关系。"],"调整 x，比较 m² 与 (m + x)(m − x)。解释周长相同为何仍可能面积不同。","一边增加 x、另一边减少 x 只保持两边之和，不保持乘积。",["5 × 5 与 7 × 3 相比，前者多多少？",["0","2","4"],2,"这是 m = 5、x = 2 的情形，面积差为 x² = 4。"],"守恒什么，要说清楚。一个量不变，不代表所有相关量都不变。"],[2,9,11,"从平方关系到黄金分割","golden","一条线怎样分成两段，让整体与大段的比等于大段与小段的比？","极端与中项比（黄金分割）：若整体 L = x + y、x > y > 0，则 L : x = x : y。",["把比例转为面积条件：x² = Ly（II.11 的构造目标，比例语言在卷六定义）。","用现代代数代入 y = L − x，得到 x² + Lx = L²。","完成平方得 (x + L/2)² = 5L²/4，于是 x/L = (√5 − 1)/2。正根符合长度条件。"],"移动分点，比较 x² 与 L(L − x)。用“定位黄金分割”观察等式成立的位置，然后解释为什么不是中点。","0.618…是近似值；精确关系是 x² = L(L − x)。黄金分割也不是所有美感的万能解释。",["L = 1 时，正确的精确条件是什么？",["x² = 1 − x","x = 0.6","x² = x − 1"],0,"面积条件给出 x² = 1 − x。正解约为 0.618，但小数显示不是定义。"],"精确对象可以由关系定义，而不必依赖写完它的小数展开。"],[2,12,14,"直角以外，平方和怎样修正？","cosine","把直角张大一点，原来的平方和公式会发生什么？","投影：一条线段在指定直线方向上的分量。这里用现代余弦写法解释 II.12、13。",["在两边 a、b 的夹角 C 处作垂线，把一般三角形拆成直角三角形。","分别应用 I.47，再展开相应平方；高度项消去，留下投影造成的差额。","现代写法为 c² = a² + b² − 2ab cos C。锐角时减去正量，钝角时增加正量；II.14 再把等积转化发展为求积作方。"],"移动夹角，从锐角经过 90° 到钝角，比较 c² 与 a² + b² 的大小。","“最长边的平方等于另两边平方和”不是任意三角形的性质；直角是必要条件。",["夹角 C > 90° 时，对边 c² 与 a² + b² 的关系？",["更小","相等","更大"],2,"钝角余弦为负，减去 2ab cos C 实际是增加一个正量。"],"推广一个结论常常需要找到被特殊条件消去的项。直角使投影修正项恰好为零。"],[3,1,15,"从弦找到看不见的圆心","chord","圆心没有标出来，怎样用直线找回它？","弦：连接圆周上两个点的线段。弦的垂直平分线经过圆心。",["连结圆心 O 与弦 AB 两端；OA = OB，因为二者都是半径。","取弦中点 M，OM 为公共边，两侧三角形由三边全等；相邻且相等的两角都是直角。","所以弦中垂线包含圆心；两条不平行弦的中垂线交点确定圆心（I.10、I.11、III.1、3）。"],"改变弦到圆心的距离 d。观察越靠近圆心的弦越长，直径对应最大弦。","一条弦的中垂线只能把圆心限制在一条直线上；通常还要第二条独立的弦。",["半径固定时，弦离圆心越近，弦长怎样变化？",["越短","越长","总不变"],1,"半弦长的平方为 r² − d²。d 变小，半弦长变大；原典可用三角形关系证明。"],"我们从可见的边界推断隐藏的结构。这是反问题的一个简单模型。"],[3,16,19,"切线为什么垂直于半径？","tangent","一条直线怎样刚好碰到圆，却不穿过去？","切线：与圆只有一个公共点的直线。切点半径垂直于切线。",["设 T 是圆上的点，过 T 作垂直于 OT 的直线。","对直线上任意 P ≠ T，直角三角形给出 OP² = OT² + TP² > r²，所以 P 在圆外。","直线只有 T 在圆上，因此它是切线。反过来，若切线不垂直半径，圆心到线的垂足更近，会使直线穿入圆内。"],"转动切点，观察切线随之旋转，但与半径仍成直角。","切线看起来像贴着一小段圆弧；精确欧氏几何中它只与圆共享一个点。",["半径 OT 与切点 T 处切线之间的角是多少？",["45°","90°","随半径变化"],1,"切点半径与切线垂直，转动整个构型不会改变这份关系。"],"局部接触条件可以由全局距离性质推出。这里只用有限几何，不必先学导数。"],[3,20,34,"同一段弧，约束着角","circle-angle","把观察点沿圆周移动，为什么看到同一条弦的张角保持不变？","同弧圆周角：顶点位于圆上、两边截取同一段弧的角；对应圆心角是它的两倍。",["连接圆心与角的三个顶点，把图形分成具有相等半径的等腰三角形。","用等腰三角形底角相等与三角形内角和，按圆心位置分别相加或相减，得圆心角是圆周角的两倍（III.20）。","同一弧对应同一个圆心角，故同段圆周角相等；直径对应 180° 圆心角，故半圆中的圆周角为直角。"],"拖动观察角的滑杆，使 P 在同一弧上移动。注意 P 不能越过弦端点；跨到另一段圆周时需要改用补角。","“对同一条弦的所有圆周角都相等”少了同段条件；另一段的角通常互补。",["直径 AB 对圆上第三点 P 张成的 ∠APB 是多少？",["60°","90°","180°"],1,"对应半圆圆心角为 180°，圆周角是它的一半。"],"一个正确的图像直觉需要说出活动范围。拖动越过边界时，定理的条件可能已经变了。"],[3,35,37,"不同割线，同一个乘积","power","从圆外同一点画两条不同割线，哪些长度组合保持不变？","点对圆的幂：现代记号 OP² − r²。外点 P 的割线交圆于 A、B 时，PA·PB 等于这同一个量。",["把两条割线的交点按圆周顺序连成三角形。","由同段圆周角相等得到相似三角形，再由对应边比例交叉相乘，得到两条割线乘积相等。","当另一条线为切线 PT 时，乘积等于 PT²；这给出 III.36。III.37 在相应条件下反推切线。"],"改变圆外点的位置，比较 PA·PB 与 PT²；再改变割线方向，看乘积如何保留。","外点公式用的是“外段 × 整段”，不是外段乘圆内那一小段。本课用卷六的相似作现代后视解释。",["外段 PA = 2、整段 PB = 8，切线 PT 多长？",["4","6","16"],0,"PT² = 2 × 8 = 16；长度取正，因此 PT = 4。"],"乘积不变量把不同方向的测量联系起来。证明可以选择不同路线，但要说明借用了哪些后来的工具。"],[4,1,5,"内心和外心，各回答什么问题？","centers","一个圆要在三角形里面同时碰到三条边，圆心该放在哪里？","内心是角平分线交点，到三边等距；外心是边的中垂线交点，到三顶点等距。",["角平分线上的点到角的两边有相等的垂直距离，可用直角三角形全等证明。","两条角平分线的交点到三边等距，作这份距离为半径的圆，得到内切圆（IV.4）。","外接圆改用点到两个端点等距的轨迹：两条中垂线相交，得到到三个顶点等距的圆心（IV.5）。"],"切换“内切圆”和“外接圆”，比较半径连接的是边的垂足还是三角形顶点。","内心一定在三角形内部；钝角三角形的外心在外部。两种中心不能混用。",["找外接圆圆心应该相交哪两条线？",["角平分线","边的中垂线","任意两条中线"],1,"外接圆需要到三个顶点等距，中垂线正好表达两端点等距。"],"先确定你需要哪一种“相等”，再选择对应的轨迹。不同问题会产生不同的中心。"],[4,6,9,"正方形与圆的两种接触","polygon4","正方形放进圆里，与圆放进正方形里，是同一种尺度吗？","内接多边形的顶点在圆上；外切多边形的边与圆相切。",["作两条互相垂直的直径，顺次连接四个端点。","四个相等圆心角给出等弦，半圆中的圆周角为直角，故得到内接正方形。","若在四个直径端点作切线，得到外切正方形。半径 r 对应内接边长 √2r，外切边长 2r。"],"调整边数到 4，比较内接与外切边界。读出半径固定时两种正方形面积的差别。","内接正方形的对角线等于直径；它的边长不等于直径。",["半径为 1 的圆内接正方形的面积是多少？",["1","2","4"],1,"正方形对角线为 2，由勾股得边长平方为 2，面积即 2。"],"同一个形状的不同约束会给出不同的尺度。图形名称不代替边界条件。"],[4,10,14,"五边形为什么遇见黄金分割？","pentagon","正五边形的对角线，为什么反复出现同一种比例？","正五边形：五边相等、五角相等。对角线形成的相似三角形带来极端与中项比。",["连接正五边形的对角线，利用相等圆弧得到 36°、72° 的角关系。","大三角形与内部的小三角形相似，对应边得到 d/s = s/(d − s)。","令 φ = d/s，则 φ² = φ + 1，取正根得 φ = (1 + √5)/2。原典 IV.10—14 用此前的构造建立五边形。"],"打开对角线，改变整体尺寸。比较对角线与边长之比，解释放大为何不改变它。","图中用坐标绘制精确形状的近似显示，不代表已经执行尺规步骤；存在性构造需结合原命题阅读。",["正五边形对角线 d 与边 s 的关系是哪一项？",["d = s","d/s = (1 + √5)/2","d/s = 2"],1,"相似给出 φ² = φ + 1，正根即黄金比。"],"一个比例的反复出现常有共同的结构原因：相似与自嵌套，不必诉诸神秘数字。"],[4,15,16,"从六边形走到十五边形","polygon","为什么用圆的半径沿圆周截取，正好能走六步？","正 n 边形每条边对应的圆心角为 360°/n；尺规可构造性仍需专门证明。",["圆心 O 与相邻点 A、B 组成等边三角形时，OA = OB = AB = r，圆心角为 60°。","六个 60° 拼成一周，得到内接正六边形（IV.15）。","三分之一圆周与五分之一圆周之差为 2/15 圆周；再平分这段弧得到 1/15，构造正十五边形（IV.16）。"],"依次选 3、5、6、15 边，比较圆心角。用 120° − 72° 再除以 2，心算十五边形的圆心角。","能在电脑上画出正 n 边形，不意味着它一定可用古典尺规构造；例如正七边形不在这些构造结果中。",["正十五边形每条边所对圆心角是多少？",["12°","24°","48°"],1,"360°/15 = 24°，也等于 (120° − 72°)/2。"],"复杂构造可以由已会的操作组合而成，但每次组合仍要证明目标条件确实满足。"],[5,1,6,"比例，从倍数比较开始","ratio","不把 a 除以 b，怎样比较 a:b 与 c:d？","欧多克索斯式等比：对任意正整数 m、n，ma 与 nb 的大小关系和 mc 与 nd 的大小关系总一致。",["先确定比的两项是同类的正量，并能由足够大的倍数超过对方。","把 a、c 同时取 m 倍，把 b、d 同时取 n 倍；记录两组的“大于、等于、小于”。","如果所有正整数 m、n 都给出相同关系，就称 a:b = c:d。这一定义不要求找出共同单位。"],"改变 m、n，比较 2:3 与 4:6；再把第二组末项改成 7，寻找能区分两比的整数倍。","检验有限组倍数只能提供例子，不能代替定义中的“任意正整数”。",["定义中的“任意 m、n”意味着什么？",["随便检查一组","检查前十组即可","每一对正整数都必须满足"],2,"“任意”是全称条件，有限实验帮助理解，却不能穷尽它。"],"定义可以成为解决困难的工具。这里通过次序关系定义比例，绕开不能相除为整数比的困境。"],[5,7,10,"比例的相等与大小","ratio-order","如果两个比都等于第三个比，它们为什么彼此相等？","比相等是一种关系。传递性需要从定义说明，不能把比直接当成已经定义好的小数。",["若 a:b = c:d，那么每次等倍比较中，ma 与 nb 和 mc 与 nd 具有相同的次序。","若 c:d = e:f，同一次比较又把这种次序传给 me 与 nf。","所以 a:b = e:f（V.11 的思想，V.7—10 先处理等量和比的比较）。较大的同类量与相同量相比也给出较大的比。"],"让两比相等后同步改变倍数；再只增大第一个前项，看大小关系何时出现差异。","两个比的小数前几位相同不等于比相等；比较应控制近似误差，证明应使用关系本身。",["同一个正数 b 作后项，a > c 时 a:b 与 c:b 怎样？",["前者较大","两者相等","无法判断"],0,"在共同的正后项下，前项越大，比越大。"],"基本关系的性质也要被证明。现代写法的一行等式背后，是定义和推理规则。"],[5,11,18,"倒比、分比与合比","ratio-transform","已知两组比相等，倒过来、减去一份或加上一份还相等吗？","倒比交换前后项；合比把前后项之和与后项相比；分比涉及差，须满足正量条件。",["设 a:b = c:d。用现代正实数记法，设共同的比为 k，则 a = kb、c = kd。","所以 (a + b):b = (k + 1):1 = (c + d):d；在 a > b、c > d 时，差比也相等。","原典以倍数定义证明这些变换，现代代数是帮助复述的另一种表达；变换时应保持对应项位置。"],"在比例条形图中选择“合比”或“分比”，看前项增加或减少一份后项。","由 a:b = c:d 不能把 a:d 与 b:c 随意判为相等；交替变换也须符合量的种类条件。",["2:3 = 4:6，正确的合比是哪一个？",["5:3 = 10:6","2:5 = 6:10","5:2 = 6:4"],0,"前后项分别相加后仍与各自的后项比较，得到 5:3 = 10:6。"],"代数操作不是排列符号的游戏。每一次“移项”“合并”都应能还原成量的关系。"],[5,19,25,"合并同样的比例","ratio-sum","两份饮料都是同样浓度，混合后为什么仍然一样？","在 a:b = c:d 且各项为正时，有 (a+c):(b+d) = a:b。先把数量的种类对应好。",["记共同的比为 k，于是 a = kb、c = kd。","相加得 a+c = k(b+d)，所以总前项与总后项仍是 k:1。","这对应 V.12 的同比分量求和思想；V.19—25 进一步组织差量、连锁等比与不等式。现代例子中的混合还需确认分母代表哪种总量。"],"放大第二份比例条，但保持其前后项同倍变化，比较合并前后的比。","简单相加两个比的分子分母不能得到任意两个比的算术平均；分母不同会形成加权关系。",["1:2 与 3:6 合并前项和后项，得到什么？",["4:8 = 1:2","4:8 = 2:1","4:8 = 4:1"],0,"两组比相同，合并得 4:8，约简仍为 1:2。"],"“整体继承部分的性质”需要条件。相同比例能被合并保留，任意性质却未必如此。"],[6,1,6,"平行截线制造相似","similar","为什么影子能帮助估计难以直接测量的高度？","相似三角形对应角相等、对应边成比例。平行截线在三角形中保留对应角。",["在三角形 ABC 中作 DE ∥ BC，且 D、E 分别在 AB、AC 上。","平行线给出相等的对应角，结合卷五比例与同高面积关系，可得 AD:AB = AE:AC = DE:BC（VI.2、4）。","若太阳光近似平行，物体与影子构成的直角三角形便有共同的锐角，可据对应边比例推算高度。"],"改变缩放系数 k，比较两三角形的对应边和对应角；再切换面积读数。","相似不能只凭“看起来形状差不多”；实际测量还依赖竖直、平地和同时光照等模型条件。",["相似三角形对应边是 2 倍，对应角是多少倍？",["2 倍","4 倍","相等"],2,"相似保持角度，改变长度尺度。"],"数学模型与世界相连时，必须把假设也带过去。算式正确不保证测量条件自动满足。"],[6,7,13,"从角平分线到中比例","mean","给定两段长度，如何构造它们的几何平均？","中比例数 x 满足 a:x = x:b，即 x² = ab。它与算术平均 (a+b)/2 不同。",["把长度 a、b 首尾相接作 AB，并以 AB 为直径作半圆，分点记作 D。","在 D 作垂线交半圆于 C。由半圆圆周角为直角，ACB 是直角三角形。","高 CD 两侧的小三角形相似，得 AD:CD = CD:DB，所以 CD² = ab（VI.8、13）。"],"改变 a、b，观察半圆内的高与 √ab。比较它和两段的算术平均，找出二者相等的条件。","几何平均只在本课的正长度范围使用；不能把负数代入后仍声称画出了同样的线段构造。",["a = 4、b = 9 的中比例数是多少？",["6","6.5","13"],0,"x² = 36，长度取正，所以 x = 6；6.5 是算术平均。"],"长度运算可以转译为几何存在性问题：找到一个满足关系的构造，等于找到该运算的图形实现。"],[6,14,23,"长度放大，面积平方放大","similar-area","把图形边长都变成三倍，涂色用量也只变成三倍吗？","相似平面图形的面积比等于对应边比的平方（VI.19、20）。",["三角形相似时，对应底长放大 k 倍；对应高也放大 k 倍。","由面积等于底乘高的一半，面积变成 k² 倍。","一般相似多边形可分成对应的相似三角形，把各部分面积相加，仍保持 k² 比。"],"调整 k，先猜长度比与面积比，再核对。用 k = 1/2 检查“面积减半”的直觉。","只有形状相似且所有线性尺度同倍变化，才能直接用平方尺度律。",["边长缩小到原来一半，相似图形面积变为多少？",["1/2","1/4","1/8"],1,"底和高各乘 1/2，面积乘 1/4。"],"量纲提醒我们不同种类的量如何变化。长度、面积和体积的尺度关系不能互换。"],[6,24,33,"条件构造与极端中项比","golden","不是所有给定面积，都能装进限定形状的缺口中。边界在哪里？","面积应用问题：在给定线段上构造规定形状的平行四边形，并满足亏缺或超出条件。",["把长度 L 分成 x 与 L−x 时，相应矩形面积为 x(L−x)。","利用 II.5 得 x(L−x) = L²/4 − (x−L/2)²，所以它不超过 L²/4。","这说明为什么某些面积构造需要上界条件（VI.27、28）；VI.30 则把極端与中项比作为专门的比例构造。"],"移动分点，观察矩形面积在中点达到最大；再定位黄金分割，比较两种分点解决的不同问题。","最大矩形面积的分点是中点；黄金分割点解决的是另一个平方与矩形相等问题。",["L = 10 时，x(10−x) 最大是多少？",["20","25","50"],1,"最大值在 x = 5 处，为 25。偏离中点会减去一个平方。"],"构造的可行范围与证明一样重要。先找边界，再寻找解，可以避免追逐不存在的对象。"],[7,1,3,"辗转相除：保留共同的单位","gcd","为什么不断取余，最终留下的数就是最大公约数？","若 a = qb + r，则同时整除 a、b 的数，也恰好同时整除 b、r。",["共同因数 d 整除 a、b，就整除 a−qb = r；所以共同因数不会丢失。","反过来，d 若整除 b、r，也整除 qb+r = a；所以不会凭空增加共同因数。","余数是递减的非负整数，最终到 0；最后非零余数整除前面的每一项，且是最大共同单位。"],"输入两个 2—120 的整数，逐步取余。每一步指出“数变了、共同因数集合没变”的理由。","0 是现代算法的结束标记；原典的整数单位语言与现代把 0 纳入整数的写法不同。",["48 = 2×18 + 12，下一步应比较哪两个数？",["48 与 12","18 与 12","2 与 12"],1,"等价地寻找 gcd(18,12)，共同因数集合保持不变。"],"算法的正确性来自不变量，结束性来自严格递减。能算出答案和能证明算法可靠是两项工作。"],[7,4,10,"部分、倍数与整数比例","number-ratio","12 和 18 为什么可以被同一份“6”组织起来？","若 b = ka（k 为正整数），则 a 量尽 b，也就是 a 整除 b；有共同单位不代表一数必整除另一数。",["取 a、b 的共同单位 d，写成 a = md、b = nd。","原来的整数比 a:b 可由单位个数之比 m:n 表示。","若 d 是最大公约数，m、n 不再有大于 1 的共同因数；否则还能把共同单位放大，与“最大”矛盾。"],"选择 12 与 18，观察共同块 6 如何把两行分成 2 块与 3 块；再尝试互素的一组数。","12:18 与 2:3 是相等的比，但 12、18 与 2、3 不是相等的数。",["12:18 的最简整数比是什么？",["3:2","2:3","6:9"],1,"最大公约数为 6，分别除以它得到互素的 2、3。"],"抽象是忽略共同尺度、保留关系。但必须说明忽略的是什么，保留的又是什么。"],[7,11,23,"互素，为什么能穿过乘积？","coprime","一个素数整除乘积，为什么必整除某个因子？","互素：最大公约数为 1。素数的正因数只有 1 与自身。",["若素数 p 不整除 a，由 p 的因数结构可知 gcd(p,a) = 1。","卷七的互素与整除性质说明：与 a 互素的 p 若整除 ab，就必须整除 b（VII.30）。","现代补充证明可用整数恒等式 up+va = 1，两边乘 b；左侧两项都被 p 整除，从而 p 整除 b。该恒等式属于现代扩展。"],"选择 p 与 a、b，观察 p 是否整除乘积，再分别检查因子。试用合数 6 找出相同说法的反例。","把“素数”改为“任意整数”会错：6 整除 2×3，却既不整除 2 也不整除 3。",["6 整除 2×3 这个例子说明什么？",["素数引理错误","素数条件不能随意删除","2 与 3 不互素"],1,"6 不是素数，这说明定理的条件有实际作用。"],"反例是检查必要条件的工具。找到一个不满足前提的例子，并不反驳原定理。"],[7,24,39,"从共同单位到共同倍数","lcm","两盏灯每隔 12 秒、18 秒闪一次，何时再次同时闪？","最小公倍数是两个正整数共同倍数中最小的一个。",["设 d = gcd(a,b)，写成 a = dx、b = dy，且 x、y 互素。","dxy 同时是 a、b 的倍数；任何公倍数都需包含 x、y 所要求的因子。","故 lcm(a,b) = dxy = ab/d。卷七后半发展互素、素因子和最小公倍数的构造。"],"改变两个周期，用倍数列表找第一次重合，再对照 a×b/gcd(a,b)。","直接相乘能得到公倍数，但不一定是最小公倍数；共享因子会被重复计算。",["12 与 18 的最小公倍数是多少？",["6","36","216"],1,"gcd = 6，因此 lcm = 12×18/6 = 36。"],"同一结构有两种方向：向下找共同单位，向上找共同节律。"],[8,1,6,"最简比例怎样长成数列","sequence","要让每一步的比都是 2:3，最短的一串整数该怎么写？","连比例：相邻两项的比都相等。原典讨论有限整数列，不把任意实数列都视作同一种对象。",["若互素的 p、q 给出相邻比 p:q，则三项可取 p²、pq、q²。","四项可取 p³、p²q、pq²、q³；相邻比约去共同因子后仍为 p:q。","互素条件保证最简链没有被共同因子整体放大；VIII.1—6 组织这种最小整数比例结构。"],"改变互素的 p、q 及项数，观察幂指数一减一增，并核对每个相邻比。","整数的最简连比例数列与随意指定首项的实数等比数列不同；任意首项未必让所有项都是整数。",["相邻比为 2:3 的三项整数链是哪一组？",["2、3、4","4、6、9","2、6、18"],1,"4:6 = 6:9 = 2:3。"],"把关系重复施加，会产生结构。一个局部规则可以约束整串对象。"],[8,7,13,"等比链中的整除结构","powers","如果一个数被另一个数反复相乘，哪些因子会一直留下？","数的幂是重复乘法的现代记法。整数连比例中的整除关系可沿链传递，但要检查方向。",["在整数等比链 a、ar、ar²…中，若 r 是正整数，每项都整除后面的项。","更一般的有理比 p:q 可写为 p 的递减幂和 q 的递增幂，考察各因子的出现次数。","不能由首末项的某一整除关系随意猜中间项；VIII.7—13 对连续比例与互素条件进行逐项论证。"],"选择 p、q，查看每个整数项的因子分解。对比 q/p 为整数与非整数的情形。","等比数列不总是后一项为前一项的整数倍，例如 4、6、9。",["4、6、9 是整数等比链，6 是否一定是 4 的整数倍？",["是","不是","等比链不允许整数"],1,"公比为 3/2，等比只要求比相同，不要求公比是整数。"],"一个术语里含有“比例”，并没有自动携带“整除”。把概念逐个拆开，能避免偷换条件。"],[8,14,19,"平方数之间的一座桥","square-mean","为什么两个平方数之间，总能插入一个整数中比例数？","a² 与 b² 的几何平均是 ab；对于互素的端项，存在整数中比例数与平方结构密切相关。",["平方数 a²、b² 之间取 ab。","a²:ab = a:b = ab:b²，所以三者成连比例。","反方向需注意互素条件：互素正整数 A、B 若 AB 是平方数，则各素因子的指数都为偶数，故 A、B 各为平方数。这是现代因子解释。"],"改变 a、b，观察 a²、ab、b² 组成的链；比较 2、6、18，解释为什么它不反驳带互素条件的逆向论证。","非互素端项 2 与 18 也有整数中比例数 6，但两端都不是平方数。",["4 与 25 之间的整数中比例数是多少？",["10","14.5","20"],0,"4:10 = 10:25 = 2:5；也可用 √(4×25)=10。"],"一个正向结论的逆命题常需要额外条件。互素条件会排除因子在两端相互补齐的情形。"],[8,20,27,"立方数与两座桥","cube-mean","两个立方数之间，为什么恰好能搭起两项连续比例？","在 a³ 与 b³ 之间插入 a²b、ab²，可构成四项连比例。",["计算相邻比：a³:a²b = a:b，a²b:ab² = a:b，ab²:b³ = a:b。","因此两项中比例数把立方尺度分成三次相同的线性比变化。","这与相似立体体积按线性尺度立方变化相呼应；VIII.20—27 研究平方、立方和相似平面数、立体数的关系。"],"选择 a = 2、b = 3，观察 8、12、18、27，并逐对约分。","存在实数中比例数不代表存在整数中比例数，更不代表可以用尺规构造任意立方根。",["8 与 27 之间的两项中比例数是什么？",["9、18","12、18","12、24"],1,"8:12 = 12:18 = 18:27 = 2:3。"],"相同的比例语言可以跨越数论与几何，但两个领域各自的对象范围不能被忽略。"],[9,1,10,"乘积里藏着怎样的幂？","factor","两个数相乘得到平方数，它们自己一定都是平方数吗？","平方数的每个素因子指数为偶数；立方数的指数为 3 的倍数。这是现代算术解释。",["相乘时，同一素因子的指数相加。","若两个因子互素，素因子不会在两者之间共享；乘积指数为偶数迫使各因子中指数为偶数。","没有互素条件便可互补，例如 2×8 = 16。IX.1—10 从相似平面数、立体数与连续比例研究这些关系。"],"改变两个因子，检查乘积是否为平方数；专门寻找“乘积是平方但因子不是”的例子。","互素是某些逆向推断的关键；2×8 的例子不适用于互素因子结论。",["2×8=16 给出了哪个说法的反例？",["平方数能相乘","平方乘积的两个因子一定各为平方","互素平方乘积的因子各为平方"],1,"第二个说法缺少互素等条件。"],"分解的价值在于让不可见的结构显现：数值相同的结果，可能来自不同的因子组织。"],[9,11,20,"素数，永远还有下一种","primes","假如有人递给你“全部素数”的有限名单，怎样证明它漏了东西？","素数：大于 1 且只有 1 与自身两个正因数的整数。任意大于 1 的整数都有素因子。",["假设完整名单为 p₁,…,pₙ，令 N = p₁p₂…pₙ + 1。","每个名单里的素数去除 N 都余 1，所以没有一个能整除 N。","N 本身是素数，或它有素因子 q。无论哪种情形，都出现名单外素数，与“完整”矛盾（IX.20 的现代表达）。"],"选择名单长度，计算乘积加一并分解。找到 N 不是素数的例子，解释证明为何仍然有效。","乘积加一不一定是素数；证明只需要它有一个名单外的素因子。",["2×3×5×7×11×13+1=30031=59×509。这会破坏证明吗？",["会，N 必须是素数","不会，59 与 509 都在原名单外","会，因为名单太短"],1,"构造保证的是原名单中没有数整除 N，不保证 N 自身为素数。"],"无限性可以通过对任意有限名单的反驳来证明，而不需要完成一项无限长的计算。"],[9,21,34,"奇偶性：只保留一个余数","parity","不做完整计算，能判断一个很大乘积是奇数还是偶数吗？","偶数写作 2k，奇数写作 2k+1；奇偶性只记录除以 2 的余数。",["偶数与偶数相加为 2(a+b)，仍为偶数；两个奇数相加为 2(a+b+1)，也为偶数。","奇数乘奇数为 (2a+1)(2b+1)=2(2ab+a+b)+1，仍为奇数。","乘积若有偶因子便含有一个因数 2，因而为偶数；IX.21—34 系统组织奇偶的运算关系。"],"改变 a、b，在成对圆点图中寻找留下的单个点。先判断奇偶，再看计算值。","乘积为偶数只保证至少一个因子为偶数，不保证两个都为偶数。",["一个乘积是奇数，那么两个整数因子一定怎样？",["至少一个偶数","都为奇数","都为偶数"],1,"只要有偶因子乘积就会是偶数，所以奇数乘积的两个因子都必须为奇数。"],"丢弃无关细节也能获得可靠结论。模运算就是把这种信息压缩发展为系统语言。"],[9,35,36,"等比求和与完全数","perfect","6 为什么会等于它所有真因数的和？","完全数是等于其正真因数之和的正整数。若 2ᵖ−1 是素数，则 2ᵖ⁻¹(2ᵖ−1) 是完全数。",["等比和 S = 1+2+…+2ᵖ⁻¹ 满足 2S−S = 2ᵖ−1，所以 S = 2ᵖ−1（IX.35 的特例）。","设 q = 2ᵖ−1 为素数，N=2ᵖ⁻¹q 的因数由 2 的幂及其乘 q 两组组成。","所有因数和为 (1+2+…+2ᵖ⁻¹)(1+q)=q·2ᵖ=2N；去掉 N 自身，真因数和恰为 N（IX.36）。"],"选择 p = 2、3、5、7，查看真因数求和；再选 p = 4，观察素数条件失败。","“2ᵖ−1 为素数”不可省略；本课证明的是充分条件，不是欧几里得已经完成了所有完全数分类。",["p=3 时，得到哪个完全数？",["12","28","31"],1,"q=7 为素数，N=4×7=28，且 1+2+4+7+14=28。"],"分类中的“能构造一些”与“已经找到全部”是不同命题。要区分充分条件、必要条件和完整分类。"],[10,1,18,"长度能量尽，平方呢？","irrational","正方形的边与对角线，能被同一段小尺子恰好量尽吗？","长度可公度指存在共同单位长度；平方可公度指两段上的正方形存在共同面积单位。",["单位正方形对角线 d 满足 d²=2。假设 d=p/q，且 p、q 互素。","p²=2q² 说明 p 为偶数；写 p=2k，又得 q²=2k²，说明 q 也是偶数，矛盾。","因此 d 与 1 在长度上不可公度，但平方比为 2:1，在平方上可公度。这是现代补充证明，配合 X.1—18 的一般框架。"],"切换 √2、√3、√4、⁴√2，分别比较长度与平方的可公度性。","第十卷相对于单位线的“有理线”包括 √2 这种平方可公度线，不等于现代有理数长度。",["√2 与 1 的关系是什么？",["长度与平方都可公度","长度不可公度，平方可公度","平方也不可公度"],1,"长度比 √2 不是有理数，平方比却是 2:1。"],"历史术语不能直接套上现代含义。先重建它自己的分类，才能理解它在解决什么问题。"],[10,19,47,"和式的类型，来自交叉项","binomial","两段平方都能量尽的线，加起来以后，平方还一定能量尽吗？","二项线是两条仅平方可公度的“有理线”之和。中项线（medial）的平方来自由这类线围成的中项面积。",["相对于单位线取 a=√2、b=1，二者平方均为有理数，但长度不可公度。","(a+b)²=3+2√2，交叉项把不可公度带入总平方，所以 a+b 是二项线的一个实例。","X.19—35 构造所需面积与线，X.36—41 区分六类和式，X.42—47 证明满足各类条件的分解唯一性。"],"改变根号内的数，比较 a²+b² 与 2ab 的类型，指出不可公度的来源。","任意两个现代无理数之和不一定是第十卷的二项线；必须符合其类型定义。",["(√2+1)² 中哪个部分是不可公度的交叉项？",["2+1","2√2","1"],1,"交叉项为 2√2，不能在平方展开时遗漏。"],"分类记录了运算如何把一种对象带到另一种对象，而不只是给它们起名字。"],[10,48,84,"构造、平方与分解唯一性","irrational-family","一条线当然可以任意切开，为什么原典却说分解唯一？","唯一性限制的是满足指定类型条件的分解，不是任意切割。",["对 x=a+b 平方得 x²=a²+b²+2ab，两部分的可公度类型决定 x 的类别。","X.48—65 配对研究六种二项线的构造与面积开方、平方；X.66—72 研究伸缩和求和后的类别。","X.73—78 转向六类差式，X.79—84 讨论规定类型的添补项唯一性：比较两种假想分解，利用可公度关系排除不一致。"],"切换和式与差式，再把全体长度乘同一正有理数，观察类型条件的保留。","实验展示 √n±1 代表族；六类和式与六类差式各自的完整条件应结合下方命题阅读。",["分解唯一性排除什么？",["任何第二个切点","第二种同样符合规定类型的分解","一切测量"],1,"定义的限制是定理的一部分；任意切割仍有无数种。"],"存在性说明能找到，唯一性说明符合条件的解不会有第二个。两项工作不同。"],[10,85,115,"余分线与共轭的消去","conjugate","为什么 √2+1 与 √2−1 相乘会得到整数？","余分线（apotome）是特定类型的差式。现代共轭 a+b、a−b 的乘积为 a²−b²。",["展开 (a+b)(a−b)，两项 ab 互相抵消，剩下 a²−b²。","取 a=√2、b=1，乘积为 1，所以 1/(√2+1)=√2−1。","X.85—110 建立差式的构造与分类；X.111—114 联系二项线与余分线；X.115 说明可不断构造新的不可公度线。"],"改变 n，核对 (√n+1)(√n−1)=n−1；把小数读数重新写成精确表达式。","分母有理化改变表示，不会把原来的无理数变成有理数。",["1/(√2+1) 等于什么？",["√2+1","√2−1","1/3"],1,"分子分母乘 √2−1，分母变为 2−1=1。"],"找到恰当配对后，复杂对象也能形成简单关系。消去交叉项比追逐小数更能说明原因。"],[11,1,10,"一条线怎样垂直整个平面？","perpendicular","电线杆与地面上一条线垂直，就说明它竖直了吗？","线面垂直要求垂直于平面内过垂足的所有直线；判定只需两条不同方向的相交直线。",["仅垂直一条地面线，杆仍可在与它垂直的平面内倾斜，所以条件不足。","若在交点处同时垂直地面中两条不同方向的相交线，XI.4 说明它垂直整个平面。","现代向量解释：平面内方向是两个独立方向的线性组合；对二者点积为零，对组合也为零。"],"改变杆的倾角，观察它仍垂直 x 方向，却不再垂直 y 方向。倾角归零才能同时满足。","投影里的直角不一定是空间直角；图中数值根据三维关系计算。",["检验线面垂直时，两条平面内直线应怎样？",["平行","相交且方向不同","长度相等"],1,"不同方向的相交线才能提供平面的两份独立方向信息。"],"多一个维度会改变判定条件。空间几何要求重新检查平面直觉是否充分。"],[11,11,19,"垂直和平行的空间传递","parallel-planes","同一个铅垂方向，能确定两层楼板平行吗？","不同平面都垂直同一直线，则两平面平行；两平面相交时交集是一条直线。",["两平面中经过铅垂线交点的每个方向，都与共同法线垂直。","因此两平面方向相同；若不同而仍相交，就与共同垂直关系矛盾（XI.14）。","第三平面截它们产生平行交线（XI.16）；多层平行平面在两条横截线上截出成比例线段（XI.17）。"],"旋转视角，调整平面间距；区分平行与等间距两种条件。","空间里不相交的两条线还可能异面；平行的共面条件不能省略。",["空间中两条不相交直线一定平行吗？",["一定","不一定，可能异面","一定垂直"],1,"异面直线既不相交也不平行。"],"进入三维会产生新的可能性，一个反例可以暴露默默省略的共面前提。"],[11,20,23,"一个顶点周围的角度预算","deficit","怎样用几张纸角围成一个凸起的顶点？","凸多面体顶点的面角和小于 360°；360° 减去面角和，称为角亏。",["三面角还要求任意两个面角之和大于第三个（XI.20），类似平面三角不等式。","凸立体角的面角和小于四个直角（XI.21）；等于 360° 时只会铺平。","若用 q 张正 n 边形会合，必须 q(n−2)180°/n < 360°，并且 q≥3。"],"改变 n、q，观察角亏，找出铺平与超过一周的组合。","角度预算给出必要条件；还要证明整个立体可构造并闭合。",["三个正六边形能会合成凸顶点吗？",["能，角亏 60°","不能，和恰为 360°","能，角亏 180°"],1,"每个面角 120°，合计 360°，只会铺平。"],"局部限制缩小全局可能，但局部允许与整体存在仍是两步。"],[11,24,39,"倾斜了，体积为什么不变？","shear","一摞卡片横向推斜，体积会改变吗？","平行六面体体积由底面积与垂直高度决定；斜棱长度不是高度。",["通过分割和等底等高比较，证明平行六面体体积保持（XI.29—31）。","底面积 B、垂直高 h 相同时体积相等；同高时体积比等于底面积比（XI.32）。","相似放大 k 倍，底面积乘 k²、高乘 k，体积乘 k³（XI.33）。图中的分层是现代直觉补充。"],"改变剪切量，保持底面积和垂直高度，核对体积。","不能用斜棱长乘底面积；需要两底面之间的垂直距离。",["相似立体边长放大 2 倍，体积变为几倍？",["2","4","8"],2,"三个线性尺度各乘 2，体积乘 2³=8。"],"选择不变量，往往比追踪每条变化的棱更有效。"],[12,1,2,"圆面积：让差额无处藏身","exhaustion","多边形永远不是圆，为什么还能用来证明圆面积的关系？","穷竭法把余量缩小至小于任意预定正差额，再用反证确定关系。",["两圆内相似正多边形的面积比等于直径平方比（XII.1）。","不断平分圆弧并补入三角形，余下面积持续缩小；X.1 保证它能小于指定正差额。","假设两圆面积比不是直径平方比，就存在正差额；足够精细的多边形会造成矛盾（XII.2）。"],"把边数从 6 增到 192，观察内接下界和外切上界靠拢。小数接近是观察，差额论证才是证明。","有限边数的多边形仍不等于圆；证明不必宣称到无穷步后突然变成圆。",["半径放大 3 倍，圆面积变为几倍？",["3","6","9"],2,"直径也乘 3，面积按平方比变成 9 倍。"],"严密逼近不是执行无限次操作，而是对任意指定误差说明如何控制它。"],[12,3,9,"棱锥为什么占三分之一？","pyramid","同底等高的锥体比柱体尖，究竟少了多少？","同底等高棱锥体积是棱柱的三分之一。三角棱柱可分为三个等体积棱锥。",["先用细分和穷竭证明等高棱锥的体积比等于底面积比（XII.3—6）。","把三角棱柱分成三个棱锥，由等底等高关系证明三者体积相等（XII.7）。","每一个因而占柱体的 1/3；把多边形底分成三角形，可推广到一般棱锥。"],"调整分层数。距顶点 t 倍总高处的截面积为 t² 倍底面积，观察近似体积。","截面积随距顶点距离的平方变化，不能用“平均一半大”估算。分层求和是现代辅助解释。",["底面积 12、高 6 的棱锥体积是多少？",["24","36","72"],0,"体积为 12×6/3=24。"],"证明整体量，通常要先让各部分可以比较。拆分策略与数量关系同样重要。"],[12,10,15,"从棱锥到圆锥","cone","让棱锥的底面越来越圆，三分之一的关系会保留吗？","同底等高圆锥体积是圆柱的三分之一。",["在圆底内接正多边形，形成同高棱锥与棱柱；每一对都满足 1:3。","增加边数，圆底与多边形底的差额缩小；相应体积余量也可控制。","若圆锥与圆柱不是 1:3，就存在会被逼近过程击穿的正差额，从而矛盾（XII.10）。"],"调整层数与高度，比较锥体近似体积和同底等高柱体的三分之一。","只有半径相同还不够；1:3 还要求高度相同。",["同底圆锥的高是圆柱两倍，体积比是多少？",["1:3","2:3","2:1"],1,"圆锥为 B·2h/3，圆柱为 Bh，因此是 2:3。"],"从直线边界到曲面边界，需要控制余量，而不只是相信外观相似。"],[12,16,18,"球的体积与尺度","sphere","直径增大一倍的球，体积是多少倍？","球体积比等于直径比的立方。XII.18 给出比例，并未在此求出公式常数 4π/3。",["在两个同心球之间构造内接多面体，使外球与多面体之间余量足够小（XII.17）。","对两球取相似多面体，分成对应棱锥，每组体积按线性尺度立方变化。","再用穷竭反证把比例传给球，得到 V₁:V₂=d₁³:d₂³（XII.18）。"],"调整 k，比较直径比 k、表面积比 k²、体积比 k³。表面积是现代补充。","两边必须使用同一种对应长度，不能混用一个球的半径与另一个球的直径。",["球直径加倍，体积变为几倍？",["2","4","8"],2,"体积比为 2³=8。"],"在不知道绝对公式常数时，也能先理解可靠的比例律。"],[13,1,6,"黄金分割的自我延续","golden-extend","给黄金分割的整段接上一段大段，为什么又是黄金分割？","若 L=a+b 且 L:a=a:b，则 a²=Lb。把 a 接到 L 上，新整体为 L+a。",["共同的比记作 φ=L/a=a/b，由 a²=(a+b)b 得 φ²=φ+1。","新整体与旧整体的比为 (L+a)/L=1+1/φ。","把 φ²=φ+1 除以 φ，得 1+1/φ=φ，新的 L、a 仍成黄金分割（XIII.5）。"],"点击延长一代，观察实际长度增长而比例不变。","自相似保留关系，不代表各代线段真的等长。",["由 φ²=φ+1 可知 1+1/φ 等于什么？",["φ","φ²","1"],0,"两边同除以 φ 即得结果。"],"一条保留关系的规则，就能生成不断扩大的结构。"],[13,7,12,"平面为立体准备长度","pentagon","构造二十面体以前，为什么先研究五边形和十边形？","规则立体的面与截面需要特定长度；黄金分割提供正五边形相关的精确关系。",["正五边形对角线相交形成相似三角形，分段成黄金比（XIII.8）。","同圆内接六边形边长为半径；它与十边形边长首尾相接形成黄金分割（XIII.9）。","五边形边长平方等于同圆六边形和十边形边长平方之和（XIII.10），为后续空间构造提供长度。"],"显示对角线，比较半径 r、五边形边 s₅、十边形边 s₁₀，核对 s₅²=r²+s₁₀²。","视觉对称不能代替长度证明；每个面和每条棱都需要满足构造条件。",["同圆内接正六边形的边长等于什么？",["半径","直径","半径的一半"],0,"相邻顶点和圆心构成等边三角形。"],"前面看似遥远的比例和面积命题，在空间构造中重新汇合。"],[13,13,17,"五种立体，放进同一个球","solids","同一个外接球里的不同正多面体，边长是否相同？","正凸多面体的面是全等正多边形，每顶点会合的面数相同。五种分别有 4、6、8、12、20 个面。",["四面体、八面体、立方体由规则三角形、正方形与空间垂直关系构造（XIII.13—15）。","二十面体与十二面体进一步使用五边形与黄金分割的长度关系（XIII.16、17）。","按外接球半径归一化后，旋转保留棱的三维真实长度，但屏幕投影长度会变化。"],"逐一选择五种立体并旋转，核对顶点 V、棱 E、面 F 及 V−E+F。欧拉关系是后世补充。","线框交叉点不一定是立体顶点；不同深度的棱也可能在屏幕上交叉。",["立方体的 V−E+F 是多少？",["0","2","6"],1,"8−12+6=2，为凸多面体欧拉关系。"],"模型既帮助看见，也可能制造投影错觉。要把视觉观察与三维关系分开。"],[13,18,18,"为什么恰好只有五种？","classification","规则凸立体为什么没有第六种？","每面正 n 边形、每顶点 q 面，需 n≥3、q≥3，且 q(n−2)180°/n < 360°。",["n=3 时面角 60°，可取 q=3、4、5，分别对应四、八、二十面体。","n=4 时只能 q=3；n=5 时也只能 q=3；n≥6 时三面角和已不小于 360°。","只有五种候选；此前已分别构造，才把“至多五种”和“至少五种”合并。XIII.18 比较五种边长，后续讨论排除其他规则凸立体。"],"枚举 n、q 找出所有正角亏组合，再用三维模型确认它们确实存在。","这里限定凸的规则多面体。允许星形、非凸或其他正则条件，会得到不同的分类问题。",["排除其他候选之后，还需做什么才能完成分类？",["画得好看","证明五个候选分别存在","直接假定候选存在"],1,"必要条件只给上限，构造补上存在性。"],"定义限定范围，不等式排除可能，构造保证存在：全书的方法在这里汇合。"]],VA=wp.map((A,t)=>({id:`U${A[0]}.${t%4+1}`,book:A[0],order:t%4+1,start:A[1],end:A[2],title:A[3],lab:A[4],question:A[5],definition:A[6],proof:A[7],experiment:A[8],misconception:A[9],quiz:{question:A[10][0],options:A[10][1],answer:A[10][2],explanation:A[10][3]},philosophy:A[11],range:`${ta[A[0]-1].roman}.${A[1]}—${ta[A[0]-1].roman}.${A[2]}`,source:`https://mathcs.clarku.edu/~djoyce/elements/book${ta[A[0]-1].roman}/prop${ta[A
